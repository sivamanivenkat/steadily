# Supabase CLI configuration for Steadily.
# Link a real project with `supabase link --project-ref <ref>`; the id below is a local placeholder.
project_id = "steadily-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Required for anonymous sign-ins. No email/phone accounts in MVP.
enable_signup = true
# The app uses an anonymous session only to rate-limit the cloud proxy (D-011).
enable_anonymous_sign_ins = true
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP address.
anonymous_users = 30

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.claude-proxy]
enabled = true
# The gateway rejects requests without a valid Supabase JWT (anonymous sessions included).
verify_jwt = true
import_map = "./functions/claude-proxy/deno.json"

[analytics]
enabled = false
